<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pasalads.com</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 4vmin;
    box-sizing: border-box;
    background: #14170f;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  figure {
    position: relative;
    margin: 0;
    width: min(100%, 880px);
    line-height: 0;
  }
  img {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 2px;
  }
  figcaption {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 18% 5% 5%;
    line-height: 1.05;
    letter-spacing: -0.02em;
    font-size: clamp(1.5rem, 6.5vw, 3.75rem);
    font-weight: 800;
    color: #fff;
    text-align: center;
    background: linear-gradient(to top, rgba(0,0,0,.75), transparent);
  }
</style>
</head>
<body>
  <figure>
    <img src="salad.jpg" alt="A bowl of salad">
    <figcaption>go somewhere else. salad</figcaption>
  </figure>
</body>
</html>
